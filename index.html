<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="专属婚礼照片故事">
  <title>Our Story</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

      <img class="hero__image" src="./123.jpg" alt="两人的婚礼主视觉照片">
      <div class="hero__shade"></div>
      <div class="hero__content">
        <p class="eyebrow">OUR STORY</p>

        <a class="scroll-link" href="#story" aria-label="浏览照片故事">SCROLL TO BEGIN</a>

      <p class="eyebrow">A DAY TO REMEMBER</p>
      <h2 id="story-title">一些关于我们的瞬间</h2>
    </section>

    <section class="gallery" id="gallery" aria-label="婚礼照片故事"></section>

    <section class="closing" id="closing">
      <p class="eyebrow" id="event-meta"></p>
      <p class="closing__line" id="closing-line"></p>
    </section>

  <script src="./content.js"></script>
  <script src="./gallery.js"></script>

</html>
